[tox]
envlist = unit,fmt,mypy
skipsdist = True
# Automatic envs (pyXX) will only use the python version appropriate to that
# env and ignore basepython inherited from [testenv] if we set
# ignore_basepython_conflict.
ignore_basepython_conflict = True

[vars]
src_path = {toxinidir}/src/packastack/
tst_path = {toxinidir}/tests/
all_path = {[vars]src_path} {[vars]tst_path}
uv_flags = --frozen --isolated --extra=dev

[testenv]
usedevelop = True
basepython = python3
allowlist_externals =
    uv
setenv = OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60

[testenv:unit]
description = Run unit tests
commands = uv run {[vars]uv_flags} python -m pytest -vv {posargs}

[testenv:fmt]
description = Apply coding style standards and auto-format code
deps =
    ruff
commands =
    ruff check --fix {posargs:{[vars]all_path}}  # auto-fix lint issues
    ruff format {posargs:{[vars]all_path}}       # format code

[testenv:pep8]
description = Check coding style standards without modifying code
deps =
    ruff
commands =
    ruff format --diff {posargs:{[vars]all_path}}  # show formatting diff
    ruff check {posargs:{[vars]all_path}}           # check lint issues

[testenv:mypy]
description = Type-check with mypy
commands = uv run {[vars]uv_flags} mypy {[vars]src_path}
# TODO: enable tests type-checking once test functions have return type annotations
#   uv run {[vars]uv_flags} mypy {[vars]tst_path}

[testenv:cover]
description = Run tests with coverage report
setenv =
    VIRTUAL_ENV={envdir}
commands =
    uv run {[vars]uv_flags} coverage erase
    uv run {[vars]uv_flags} coverage run -m pytest -o addopts="" {posargs}
    uv run {[vars]uv_flags} coverage html -d cover
    uv run {[vars]uv_flags} coverage xml -o cover/coverage.xml
    uv run {[vars]uv_flags} coverage report
